<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conference Word Frequency</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  padding: 2rem;
  min-height: 100vh;
}
h1 {
  font-size: 1.5rem;
  margin-bottom: 1.5rem;
  color: #fff;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: flex-end;
  margin-bottom: 1.5rem;
}
.controls label {
  font-size: 0.85rem;
  color: #aaa;
}
input[type="file"] {
  font-size: 0.85rem;
  color: #ccc;
}
input[type="text"] {
  padding: 0.5rem 0.75rem;
  font-size: 1rem;
  border: 1px solid #444;
  border-radius: 4px;
  background: #16213e;
  color: #fff;
  width: 100%;
}
input[type="text"]::placeholder { color: #666; }
.granularity-btns {
  display: flex;
  gap: 0;
  border-radius: 4px;
  overflow: hidden;
}
.granularity-btns button {
  padding: 0.5rem 1rem;
  font-size: 0.85rem;
  border: 1px solid #444;
  background: #16213e;
  color: #ccc;
  cursor: pointer;
  transition: background 0.15s;
}
.granularity-btns button.active {
  background: #0f3460;
  color: #fff;
  border-color: #0f3460;
}
.granularity-btns button:hover:not(.active) { background: #1a1a4e; }
.checkbox-group {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.85rem;
}
.checkbox-group input { cursor: pointer; }
.tooltip-anchor {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.1em;
  height: 1.1em;
  border-radius: 50%;
  background: #2a3a5e;
  border: 1px solid #4a6a9e;
  color: #8ab4f8;
  font-size: 0.7rem;
  font-weight: bold;
  cursor: default;
  position: relative;
  vertical-align: middle;
  line-height: 1;
}
.tooltip-anchor:focus { outline: 1px solid #8ab4f8; }
.tooltip-box {
  display: none;
  position: absolute;
  left: 50%;
  bottom: calc(100% + 6px);
  transform: translateX(-50%);
  background: #0d1b36;
  border: 1px solid #3a5a8e;
  color: #ccc;
  font-size: 0.78rem;
  font-weight: normal;
  line-height: 1.4;
  padding: 0.5rem 0.65rem;
  border-radius: 5px;
  white-space: nowrap;
  z-index: 10;
  pointer-events: none;
}
.tooltip-anchor:hover .tooltip-box,
.tooltip-anchor:focus .tooltip-box { display: block; }
#matched {
  font-size: 0.85rem;
  color: #8ab4f8;
  margin-bottom: 0.5rem;
  min-height: 1.2em;
}
#chart-container {
  position: relative;
  width: 100%;
  height: 450px;
  background: #16213e;
  border-radius: 8px;
  padding: 1rem;
  cursor: pointer;
}
#drilldown-section {
  display: none;
  margin-top: 1.5rem;
}
#drilldown-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.75rem;
}
#drilldown-title {
  font-size: 1rem;
  font-weight: 600;
  color: #8ab4f8;
}
#drilldown-close {
  background: none;
  border: 1px solid #444;
  color: #aaa;
  font-size: 0.8rem;
  padding: 0.25rem 0.6rem;
  border-radius: 4px;
  cursor: pointer;
}
#drilldown-close:hover { background: #2a2a4a; color: #fff; }
#drilldown-container {
  position: relative;
  width: 100%;
  background: #16213e;
  border-radius: 8px;
  padding: 1rem;
}
#status {
  margin-top: 1rem;
  font-size: 0.85rem;
  color: #888;
}
</style>
</head>
<body>
<h1>Conference Word Frequency Explorer</h1>
<div class="controls">
  <div>
    <label>Load JSONL file</label><br>
    <input type="file" id="file-input" accept=".jsonl,.json">
  </div>
  <div style="flex: 1; min-width: 150px;">
    <label>Word or phrase <span class="tooltip-anchor" tabindex="0" aria-label="Search help">?<span class="tooltip-box">Single word: matches all forms (e.g. "pray" finds prays, prayed, praying).<br>Multiple words: exact phrase match (e.g. "Second Coming").</span></span></label><br>
    <input type="text" id="search-input" placeholder="e.g. minister or Second Coming" disabled>
  </div>
  <div>
    <label>Granularity</label><br>
    <div class="granularity-btns">
      <button data-gran="session">Session</button>
      <button data-gran="conference" class="active">Conference</button>
      <button data-gran="year">Year</button>
    </div>
  </div>
  <div class="checkbox-group">
    <input type="checkbox" id="talks-only" checked>
    <label for="talks-only">Talks only (exclude business/reports/prayers)</label>
  </div>
</div>
<div id="matched"></div>
<div id="chart-container">
  <canvas id="chart"></canvas>
</div>
<div id="drilldown-section">
  <div id="drilldown-header">
    <span id="drilldown-title"></span>
    <button id="drilldown-close">✕ Close</button>
  </div>
  <div id="drilldown-container">
    <canvas id="drilldown-chart"></canvas>
  </div>
</div>
<div id="status">Load a JSONL or JSON file to begin.</div>

<script>
// --- Porter Stemmer (classic implementation) ---
const stemmer = (function() {
  const step2list = {
    "ational":"ate","tional":"tion","enci":"ence","anci":"ance","izer":"ize",
    "bli":"ble","alli":"al","entli":"ent","eli":"e","ousli":"ous","ization":"ize",
    "ation":"ate","ator":"ate","alism":"al","iveness":"ive","fulness":"ful",
    "ousness":"ous","aliti":"al","iviti":"ive","biliti":"ble","logi":"log"
  };
  const step3list = {
    "icate":"ic","ative":"","alize":"al","iciti":"ic","ical":"ic","ful":"","ness":""
  };
  const c="[^aeiou]",v="[aeiouy]",C=c+"[^aeiouy]*",V=v+"[aeiou]*";
  const mgr0=new RegExp("^("+C+")?"+V+C);
  const meq1=new RegExp("^("+C+")?"+V+C+"("+V+")?$");
  const mgr1=new RegExp("^("+C+")?"+V+C+V+C);
  const s_v=new RegExp("^("+C+")?"+v);

  function stem(w) {
    if (w.length < 3) return w;
    let stem, suffix, re, re2, re3, re4;
    if (w.charAt(0) === 'y') w = w.charAt(0).toUpperCase() + w.substr(1);

    // Step 1a
    re = /^(.+?)(ss|i)es$/; re2 = /^(.+?)([^s])s$/;
    if (re.test(w)) w = w.replace(re, "$1$2");
    else if (re2.test(w)) w = w.replace(re2, "$1$2");

    // Step 1b
    re = /^(.+?)eed$/; re2 = /^(.+?)(ed|ing)$/;
    if (re.test(w)) {
      let fp = re.exec(w);
      if (mgr0.test(fp[1])) { re = /.$/; w = w.replace(re, ""); }
    } else if (re2.test(w)) {
      let fp = re2.exec(w);
      stem = fp[1];
      if (s_v.test(stem)) {
        w = stem;
        re2 = /(at|bl|iz)$/; re3 = /([^aeiouylsz])\1$/; re4 = new RegExp("^"+C+v+"[^aeiouwxy]$");
        if (re2.test(w)) w = w + "e";
        else if (re3.test(w)) { re = /.$/; w = w.replace(re, ""); }
        else if (re4.test(w)) w = w + "e";
      }
    }

    // Step 1c
    re = /^(.+?)y$/;
    if (re.test(w)) {
      let fp = re.exec(w);
      stem = fp[1];
      if (s_v.test(stem)) w = stem + "i";
    }

    // Step 2
    re = /^(.+?)(ational|tional|enci|anci|izer|bli|alli|entli|eli|ousli|ization|ation|ator|alism|iveness|fulness|ousness|aliti|iviti|biliti|logi)$/;
    if (re.test(w)) {
      let fp = re.exec(w);
      stem = fp[1]; suffix = fp[2];
      if (mgr0.test(stem)) w = stem + step2list[suffix];
    }

    // Step 3
    re = /^(.+?)(icate|ative|alize|iciti|ical|ful|ness)$/;
    if (re.test(w)) {
      let fp = re.exec(w);
      stem = fp[1]; suffix = fp[2];
      if (mgr0.test(stem)) w = stem + step3list[suffix];
    }

    // Step 4
    re = /^(.+?)(al|ance|ence|er|ic|able|ible|ant|ement|ment|ent|ou|ism|ate|iti|ous|ive|ize)$/;
    re2 = /^(.+?)(s|t)(ion)$/;
    if (re.test(w)) {
      let fp = re.exec(w);
      stem = fp[1];
      if (mgr1.test(stem)) w = stem;
    } else if (re2.test(w)) {
      let fp = re2.exec(w);
      stem = fp[1] + fp[2];
      if (mgr1.test(stem)) w = stem;
    }

    // Step 5
    re = /^(.+?)e$/;
    if (re.test(w)) {
      let fp = re.exec(w);
      stem = fp[1];
      re2 = new RegExp("^"+C+v+"[^aeiouwxy]$");
      if (mgr1.test(stem) || (meq1.test(stem) && !re2.test(stem))) w = stem;
    }
    re = /ll$/;
    if (re.test(w) && mgr1.test(w)) { re = /.$/; w = w.replace(re, ""); }

    if (w.charAt(0) === 'Y') w = w.charAt(0).toLowerCase() + w.substr(1);
    return w;
  }
  return stem;
})();

// --- App State ---
let talks = [];
let talkIndex = []; // [{stemCounts: Map<stem, count>, surfaceForms: Map<stem, Set>, meta}]
let chart = null;
let drilldownChart = null;
let lastResults = [];
let lastGroupKeys = []; // parallel to chart bars: group key per bar
let currentGranularity = 'conference';

const fileInput = document.getElementById('file-input');
const searchInput = document.getElementById('search-input');
const matchedEl = document.getElementById('matched');
const statusEl = document.getElementById('status');
const talksOnlyCheckbox = document.getElementById('talks-only');

// --- File Loading ---
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  statusEl.textContent = 'Loading...';
  const text = await file.text();

  if (file.name.endsWith('.jsonl')) {
    talks = text.trim().split('\n').map(line => JSON.parse(line));
  } else {
    talks = JSON.parse(text);
  }

  buildIndex();
  statusEl.textContent = `Loaded ${talks.length} talks from ${file.name}.`;
  searchInput.disabled = false;
  searchInput.focus();
});

function tokenize(text) {
  return text.toLowerCase().replace(/[’‘']/g, "'").split(/[^a-z']+/).filter(w => w.length > 1);
}

function buildIndex() {
  talkIndex = talks.map(talk => {
    const tokens = tokenize(talk.full_text);
    const stemCounts = new Map();
    const surfaceForms = new Map();
    for (const token of tokens) {
      const s = stemmer(token);
      stemCounts.set(s, (stemCounts.get(s) || 0) + 1);
      if (!surfaceForms.has(s)) surfaceForms.set(s, new Set());
      surfaceForms.get(s).add(token);
    }
    return { stemCounts, surfaceForms, meta: talk };
  });
}

// --- Search ---
let searchTimeout = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(doSearch, 300);
});
talksOnlyCheckbox.addEventListener('change', doSearch);

function doSearch() {
  const query = searchInput.value.trim().toLowerCase();
  if (!query || talkIndex.length === 0) {
    matchedEl.textContent = '';
    clearChart();
    return;
  }
  const talksOnly = talksOnlyCheckbox.checked;
  const words = query.split(/\s+/);
  const isPhrase = words.length > 1;
  const results = []; // {meta, count}

  if (isPhrase) {
    for (const entry of talkIndex) {
      if (talksOnly && entry.meta.type !== 'talk') continue;
      const text = entry.meta.full_text.toLowerCase().replace(/[''']/g, "'");
      let count = 0;
      let pos = 0;
      while ((pos = text.indexOf(query, pos)) !== -1) { count++; pos += query.length; }
      results.push({ meta: entry.meta, count });
    }
    const totalCount = results.reduce((s, r) => s + r.count, 0);
    matchedEl.textContent = totalCount > 0
      ? `Phrase "${query}" — ${totalCount} total occurrences`
      : `No matches for phrase "${query}"`;
  } else {
    const queryStem = stemmer(query);
    const allSurface = new Set();
    for (const entry of talkIndex) {
      if (talksOnly && entry.meta.type !== 'talk') continue;
      const count = entry.stemCounts.get(queryStem) || 0;
      if (count > 0 && entry.surfaceForms.has(queryStem)) {
        entry.surfaceForms.get(queryStem).forEach(f => allSurface.add(f));
      }
      results.push({ meta: entry.meta, count });
    }
    const totalCount = results.reduce((s, r) => s + r.count, 0);
    const forms = [...allSurface].sort().join(', ');
    matchedEl.textContent = totalCount > 0
      ? `Matched forms: ${forms} — ${totalCount} total occurrences`
      : `No matches for "${query}" (stem: ${queryStem})`;
  }

  lastResults = results;
  renderChart(results);
  closeDrilldown();
}

// --- Granularity ---
document.querySelectorAll('.granularity-btns button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.granularity-btns button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentGranularity = btn.dataset.gran;
    doSearch();
  });
});

// --- Chart ---
function getGroupKey(meta) {
  if (currentGranularity === 'session') return `${meta.conference}-S${meta.session_order}`;
  if (currentGranularity === 'conference') return meta.conference;
  return String(meta.year);
}

function groupResults(results) {
  const groups = new Map(); // key → {label, count, sortKey}

  for (const { meta, count } of results) {
    const key = getGroupKey(meta);
    let label;
    if (currentGranularity === 'session') {
      const shortSession = meta.session
        .replace('Saturday', 'Sat').replace('Sunday', 'Sun')
        .replace('Morning', 'AM').replace('Afternoon', 'PM')
        .replace('Evening', 'Eve').replace(' Session', '');
      label = `${meta.conference} ${shortSession}`;
    } else if (currentGranularity === 'conference') {
      label = meta.conference;
    } else {
      label = String(meta.year);
    }

    if (!groups.has(key)) groups.set(key, { label, count: 0, sortKey: key });
    groups.get(key).count += count;
  }

  const sorted = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  return {
    labels: sorted.map(([, g]) => g.label),
    data: sorted.map(([, g]) => g.count),
    keys: sorted.map(([k]) => k),
  };
}

function clearChart() {
  if (chart) { chart.destroy(); chart = null; }
}

function renderChart(results) {
  clearChart();
  const { labels, data, keys } = groupResults(results);
  lastGroupKeys = keys;

  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Occurrences',
        data,
        backgroundColor: '#4a90d9',
        borderColor: '#6ab0ff',
        borderWidth: 1,
        borderRadius: 3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      onClick: (evt, elements) => {
        if (elements.length > 0) {
          const idx = elements[0].index;
          openDrilldown(lastGroupKeys[idx], labels[idx]);
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => items[0].label,
            label: (item) => `${item.raw} occurrences — click to drill down`
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#aaa', maxRotation: 65, font: { size: 11 } },
          grid: { color: '#2a2a4a' }
        },
        y: {
          beginAtZero: true,
          ticks: { color: '#aaa', precision: 0 },
          grid: { color: '#2a2a4a' }
        }
      }
    }
  });
}

// --- Drilldown ---
function openDrilldown(groupKey, groupLabel) {
  const talkResults = lastResults
    .filter(r => r.count > 0 && getGroupKey(r.meta) === groupKey)
    .sort((a, b) => b.count - a.count);

  if (talkResults.length === 0) return;

  const labels = talkResults.map(r => `${r.meta.speaker} — "${r.meta.title}"`);
  const data = talkResults.map(r => r.count);
  const barHeight = 36;
  const minHeight = 120;
  const height = Math.max(minHeight, talkResults.length * barHeight + 60);

  document.getElementById('drilldown-title').textContent = groupLabel;
  const section = document.getElementById('drilldown-section');
  const container = document.getElementById('drilldown-container');
  container.style.height = height + 'px';
  section.style.display = 'block';
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });

  if (drilldownChart) { drilldownChart.destroy(); drilldownChart = null; }

  const ctx = document.getElementById('drilldown-chart').getContext('2d');
  drilldownChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Occurrences',
        data,
        backgroundColor: '#e07b39',
        borderColor: '#f09a58',
        borderWidth: 1,
        borderRadius: 3,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (item) => `${item.raw} occurrences`
          }
        }
      },
      scales: {
        x: {
          beginAtZero: true,
          ticks: { color: '#aaa', precision: 0 },
          grid: { color: '#2a2a4a' }
        },
        y: {
          ticks: { color: '#ddd', font: { size: 12 } },
          grid: { color: '#2a2a4a' }
        }
      }
    }
  });
}

function closeDrilldown() {
  document.getElementById('drilldown-section').style.display = 'none';
  if (drilldownChart) { drilldownChart.destroy(); drilldownChart = null; }
}

document.getElementById('drilldown-close').addEventListener('click', closeDrilldown);
</script>
</body>
</html>
