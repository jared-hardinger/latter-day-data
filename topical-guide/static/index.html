<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topical Guide</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;

}

  font-size: 1.1rem;

}

  margin-top: 0.25rem;
}
.count-badge {
  display: inline-block;
  font-size: 0.75rem;
  color: #4a90d9;
  border: 1px solid #2a5a9e;

  padding: 0.1rem 0.6rem;
  margin-top: 0.5rem;

  color: #999;
  font-style: italic;

button.primary:hover { background: #3068b4; }
button.link-btn {
  background: none;
  border: none;
  color: #999;
  text-decoration: underline;
  padding: 0.2rem 0.4rem;
}
button.link-btn:hover { color: #4a90d9; background: none; }
button.btn-approve { border-color: #2a9e5a; }
button.btn-approve:hover { background: #1a4e2a; border-color: #4ad98a; }
button.btn-reject { border-color: #9e2a2a; }
button.btn-reject:hover { background: #4e1a1a; border-color: #d94a4a; }
.error-msg {
  color: #ff8080;
  font-size: 0.88rem;
  margin-top: 0.4rem;
}
.tabs {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  border-bottom: 1px solid #2a3a5e;
}
.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  color: #999;
  padding: 0.6rem 0.2rem;
  margin-right: 1.5rem;
  font-size: 1rem;
}
.tab-btn:hover { background: none; color: #ccc; }
.tab-btn.active { color: #fff; border-bottom-color: #4a90d9; }
.verse-block { margin-bottom: 1.5rem; }

  padding: 0.5rem 0.8rem;
  background: #0f1626;
  border-left: 3px solid #4a90d9;
  color: #ccc;
  font-size: 0.9rem;
  font-style: italic;
}
.search-bar {
  display: flex;
  gap: 0.6rem;
  margin-bottom: 0.6rem;
  flex-wrap: wrap;
}
.search-bar input[type="text"] { flex: 1; min-width: 200px; }
.match-count {
  color: #999;
  font-size: 0.85rem;
  margin-bottom: 1rem;
}
.result {
  list-style: none;
  border-bottom: 1px solid #2a3a5e;
  padding: 1rem 0;
}
.result:last-child { border-bottom: none; }
.result-ref {
  font-weight: 600;
  color: #4a90d9;
  font-size: 0.9rem;
  margin-bottom: 0.3rem;
}
.result-text { line-height: 1.5; margin-bottom: 0.6rem; }
.result-text mark {
  background: #4a90d9;
  color: #0d1424;
  padding: 0 2px;
  border-radius: 2px;
}
.result-actions {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
}
.badge {
  display: inline-block;
  font-size: 0.78rem;
  border-radius: 999px;
  padding: 0.15rem 0.7rem;
}
.badge-approved { color: #4ad98a; border: 1px solid #2a9e5a; }
.badge-rejected { color: #d94a4a; border: 1px solid #9e2a2a; }
.note-row { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; width: 100%; margin-top: 0.3rem; }
.note-row input { flex: 1; min-width: 150px; }
.desc-edit {
  color: #999;
  font-size: 0.92rem;
  margin-bottom: 1.5rem;
  line-height: 1.5;
}
.ai-fill { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.ai-fill input[type="text"] { flex: 1; min-width: 200px; }
.ai-note { color: #999; font-size: 0.85rem; margin-top: 0.3rem; }
.ai-warn { color: #d9a44a; font-size: 0.88rem; margin-top: 0.3rem; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.header-actions { display: flex; align-items: baseline; gap: 0.8rem; }
.edit-form { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.5rem; }
.edit-actions { display: flex; align-items: center; gap: 0.6rem; }
.edit-actions .spacer { flex: 1; }
button.btn-danger { border-color: #9e2a2a; color: #d94a4a; }
button.btn-danger:hover { background: #4e1a1a; border-color: #d94a4a; color: #fff; }
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(10, 14, 26, 0.75);
  display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 10;
}
.modal {
  background: #16213e; border: 1px solid #2a3a5e; border-radius: 10px;
  padding: 1.5rem; max-width: 460px; width: 100%;
}
.modal h2 { font-size: 1.15rem; color: #fff; margin-bottom: 0.8rem; }
.modal p { color: #ccc; line-height: 1.5; margin-bottom: 0.8rem; font-size: 0.92rem; }
.modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.2rem; }
.note-actions { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.4rem; }
.removed-strip {
  display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
  padding: 0.6rem 0.8rem; margin-bottom: 1.5rem;
  background: #0f1626; border: 1px dashed #2a3a5e; border-radius: 6px;
  color: #999; font-size: 0.9rem;
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = "/api";

async function api(path, method, body) {
  const opts = { method: method || "GET", headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  if (res.status === 204) return null;
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) {
    const message = (data && data.detail) ? data.detail : ("Request failed (" + res.status + ")");
    const err = new Error(message);
    err.status = res.status;
    throw err;
  }
  return data;
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function el(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html.trim();
  return tpl.content.firstElementChild;
}

// ---------------------------------------------------------------------------
// Routing
// ---------------------------------------------------------------------------

function currentRoute() {
  const hash = location.hash || "#/";
  const m = hash.match(/^#\/topic\/(\d+)$/);
  if (m) return { view: "topic", id: Number(m[1]) };
  return { view: "home" };
}

async function render() {
  const app = document.getElementById("app");
  const route = currentRoute();
  try {
    if (route.view === "topic") {
      await renderTopicPage(app, route.id);
    } else {
      await renderHome(app);
    }
  } catch (err) {
    app.innerHTML = `<p class="error-msg">Failed to load: ${escapeHtml(err.message)}</p>`;
  }
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

// Escape closes the delete modal if one is open, otherwise cancels topic
// edit mode if that's active. One listener, added once; editModeActive and
// cancelEditFn are updated by whichever render function is currently live.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (document.querySelector(".modal-backdrop")) {
    closeDeleteModal();
    return;
  }
  if (editModeActive && cancelEditFn) {
    cancelEditFn();
  }
});

// ---------------------------------------------------------------------------
// Home view
// ---------------------------------------------------------------------------

async function renderHome(app) {
  const topics = await api("/topics");
  app.innerHTML = `
    <h1>Topical Guide</h1>
    <p class="subtitle">A personal, curated guide to the scriptures — search, approve, and study by topic.</p>
    <div class="card">
      <div class="ai-fill">
        <input type="text" id="fill-topic-prompt" placeholder="Describe the topic… e.g. verses about praying when you don't feel like it">
        <button type="button" id="fill-topic-btn">&#10022; Fill with AI</button>
      </div>
      <div class="error-msg" id="fill-topic-error"></div>
      <div class="ai-note" id="fill-topic-reason"></div>
      <div class="ai-warn" id="fill-topic-duplicate"></div>
      <form class="inline-form" id="new-topic-form">
        <input type="text" id="new-topic-name" placeholder="New topic name (e.g. Prayer)" required>
        <textarea id="new-topic-desc" rows="3" maxlength="400" placeholder="Description (optional)"></textarea>
        <div>
          <button type="submit" class="primary">Add Topic</button>
        </div>
        <div class="error-msg" id="new-topic-error"></div>
      </form>
    </div>
    <ul class="topic-list" id="topic-list"></ul>
  `;

  const list = document.getElementById("topic-list");
  if (topics.length === 0) {
    list.innerHTML = `<li class="empty-state">No topics yet — add one above to get started.</li>`;
  } else {
    list.innerHTML = topics.map(t => `
      <li>
        <a class="topic-link card" href="#/topic/${t.id}">
          <div class="topic-name">${escapeHtml(t.name)}</div>
          ${t.description ? `<div class="topic-desc">${escapeHtml(t.description)}</div>` : ""}
          <div class="count-badge">${t.approved_count} approved verse${t.approved_count === 1 ? "" : "s"}</div>
        </a>
      </li>
    `).join("");
  }

  document.getElementById("new-topic-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("new-topic-name").value.trim();
    const description = document.getElementById("new-topic-desc").value.trim();
    const errBox = document.getElementById("new-topic-error");
    errBox.textContent = "";
    if (!name) return;
    try {
      const topic = await api("/topics", "POST", { name, description });
      location.hash = `#/topic/${topic.id}`;
    } catch (err) {
      errBox.textContent = err.message;
    }
  });

  document.getElementById("fill-topic-btn").addEventListener("click", async () => {
    const btn = document.getElementById("fill-topic-btn");
    const promptInput = document.getElementById("fill-topic-prompt");
    const errBox = document.getElementById("fill-topic-error");
    const reasonBox = document.getElementById("fill-topic-reason");
    const dupBox = document.getElementById("fill-topic-duplicate");
    errBox.textContent = "";
    reasonBox.textContent = "";
    dupBox.textContent = "";
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Filling…";
    try {
      const result = await api("/ai/topics/fill", "POST", { prompt: promptInput.value.trim() });
      document.getElementById("new-topic-name").value = result.name;
      document.getElementById("new-topic-desc").value = result.description;
      reasonBox.textContent = result.reason;
      if (result.duplicate_of) {
        dupBox.textContent = `Looks like your existing "${result.duplicate_of}". Add it anyway, or cancel.`;
      }
    } catch (err) {
      errBox.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });
}

// ---------------------------------------------------------------------------
// Topic page
// ---------------------------------------------------------------------------

let curateState = null; // { topicId, mode, results, total, query }
let editModeActive = false;
let cancelEditFn = null;

async function renderTopicPage(app, topicId, activeTab) {
  activeTab = activeTab || "study";
  const topic = await api(`/topics/${topicId}`);

  app.innerHTML = `
    <a class="back-link" href="#/">&larr; All topics</a>
    <div id="topic-header"></div>
    <div class="tabs">
      <button class="tab-btn" data-tab="study">Study</button>
      <button class="tab-btn" data-tab="curate">Curate</button>
    </div>
    <div id="tab-content"></div>
  `;

  renderTopicHeaderView(topic);

  const tabButtons = app.querySelectorAll(".tab-btn");
  tabButtons.forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === activeTab);
    btn.addEventListener("click", () => {
      renderTopicPage(app, topicId, btn.dataset.tab);
    });
  });

  const content = document.getElementById("tab-content");
  if (activeTab === "study") {
    renderStudyTab(content, topic);
  } else {
    renderCurateTab(content, topic);
  }
}

// ---------------------------------------------------------------------------
// Topic header — view / edit mode. Rendering into #topic-header only (never
// #tab-content) is what lets Edit/Cancel leave an in-progress Curate search
// untouched.
// ---------------------------------------------------------------------------

function renderTopicHeaderView(topic) {
  editModeActive = false;
  cancelEditFn = null;
  const header = document.getElementById("topic-header");
  header.innerHTML = `
    <div class="header-actions">
      <h1>${escapeHtml(topic.name)}</h1>
      <button class="link-btn" id="edit-topic-btn">Edit</button>
    </div>
    ${topic.description ? `<p class="desc-edit">${escapeHtml(topic.description)}</p>` : ""}
  `;
  document.getElementById("edit-topic-btn").addEventListener("click", () => {
    renderTopicHeaderEdit(topic);
  });
}

function renderTopicHeaderEdit(topic) {
  editModeActive = true;
  cancelEditFn = () => renderTopicHeaderView(topic);
  const header = document.getElementById("topic-header");
  header.innerHTML = `
    <div class="edit-form">
      <input type="text" id="edit-topic-name" value="${escapeHtml(topic.name)}" required>
      <textarea id="edit-topic-desc" rows="3" maxlength="400">${escapeHtml(topic.description)}</textarea>
      <div class="ai-fill">
        <input type="text" id="polish-prompt" placeholder="Optional: how to change it…">
        <button type="button" id="polish-btn">&#10022; Polish with AI</button>
      </div>
      <div class="ai-note" id="polish-reason"></div>
      <div class="error-msg" id="edit-topic-error"></div>
      <div class="edit-actions">
        <button type="button" class="primary" id="save-topic-btn">Save changes</button>
        <button type="button" id="cancel-topic-btn">Cancel</button>
        <span class="spacer"></span>
        <button type="button" class="btn-danger" id="delete-topic-btn">Delete topic</button>
      </div>
    </div>
  `;

  const nameInput = document.getElementById("edit-topic-name");
  const descInput = document.getElementById("edit-topic-desc");
  const errBox = document.getElementById("edit-topic-error");

  document.getElementById("cancel-topic-btn").addEventListener("click", () => cancelEditFn());

  document.getElementById("save-topic-btn").addEventListener("click", async () => {
    errBox.textContent = "";
    const name = nameInput.value.trim();
    if (!name) {
      errBox.textContent = "A topic needs a name.";
      return;
    }
    const description = descInput.value.trim();
    try {
      const updated = await api(`/topics/${topic.id}`, "PATCH", { name, description });
      topic.name = updated.name;
      topic.description = updated.description;
      renderTopicHeaderView(topic);
    } catch (err) {
      errBox.textContent = err.message;
    }
  });

  document.getElementById("polish-btn").addEventListener("click", async () => {
    const btn = document.getElementById("polish-btn");
    const promptInput = document.getElementById("polish-prompt");
    const reasonBox = document.getElementById("polish-reason");
    errBox.textContent = "";
    reasonBox.textContent = "";
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Polishing…";
    try {
      const result = await api(`/ai/topics/${topic.id}/description/polish`, "POST", {
        prompt: promptInput.value.trim(),
      });
      descInput.value = result.description;
      if (result.suggested_name) {
        nameInput.value = result.suggested_name;
      }
      reasonBox.textContent = result.reason;
    } catch (err) {
      errBox.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });

  document.getElementById("delete-topic-btn").addEventListener("click", (e) => {
    openDeleteModal(topic, e.currentTarget);
  });
}

// ---------------------------------------------------------------------------
// Delete modal
// ---------------------------------------------------------------------------

function joinWithAnd(items) {
  if (items.length === 1) return items[0];
  return items.slice(0, -1).join(", ") + " and " + items[items.length - 1];
}

function pluralize(n, word) {
  return `${n} ${word}${n === 1 ? "" : "s"}`;
}

function openDeleteModal(topic, triggerBtn) {
  const counts = [];
  if (topic.verses.length > 0) counts.push(pluralize(topic.verses.length, "approved verse"));
  if (topic.rejected_count > 0) counts.push(pluralize(topic.rejected_count, "rejection"));
  if (topic.note_count > 0) counts.push(pluralize(topic.note_count, "note"));

  const countsSentence = counts.length === 0
    ? "This topic has no verses yet."
    : `This also deletes ${joinWithAnd(counts)}.`;

  const modal = el(`
    <div class="modal-backdrop">
      <div class="modal" role="dialog" aria-modal="true">
        <h2>Delete "${escapeHtml(topic.name)}"?</h2>
        <p>${countsSentence}</p>
        <p>This cannot be undone from the app. The only way back is git history for guide_export.json.</p>
        <div class="error-msg" id="delete-modal-error"></div>
        <div class="modal-actions">
          <button type="button" id="delete-modal-cancel">Cancel</button>
          <button type="button" class="btn-danger" id="delete-modal-confirm">Delete topic</button>
        </div>
      </div>
    </div>
  `);
  modal._triggerBtn = triggerBtn;
  document.body.appendChild(modal);

  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeDeleteModal();
  });
  document.getElementById("delete-modal-cancel").addEventListener("click", () => closeDeleteModal());
  document.getElementById("delete-modal-confirm").addEventListener("click", async () => {
    const errBox = document.getElementById("delete-modal-error");
    try {
      await api(`/topics/${topic.id}`, "DELETE");
      location.hash = "#/";
    } catch (err) {
      errBox.textContent = err.message;
    }
  });

  document.getElementById("delete-modal-cancel").focus();
}

function closeDeleteModal() {
  const modal = document.querySelector(".modal-backdrop");
  if (!modal) return;
  const triggerBtn = modal._triggerBtn;
  modal.remove();
  if (triggerBtn) triggerBtn.focus();
}

function renderStudyTab(content, topic) {
  if (topic.verses.length === 0) {
    content.innerHTML = `<p class="empty-state">No approved verses yet. Switch to the Curate tab to search and approve some.</p>`;
    return;
  }
  content.innerHTML = topic.verses.map(v => `
    <div class="verse-block" data-verse-id="${v.verse_id}">${studyVerseInnerHtml(v)}</div>
  `).join("");

  content.querySelectorAll(".note-area").forEach(area => {
    const verseId = Number(area.dataset.verseId);
    wireStudyNoteArea(area, topic, verseId);
  });
}

function studyVerseInnerHtml(v) {
  return `
    <div class="verse-ref">${escapeHtml(v.reference)}</div>
    <div class="verse-text">${escapeHtml(v.text)}</div>
    <div class="note-area" data-verse-id="${v.verse_id}">${studyNoteDisplayHtml(v)}</div>
  `;
}

function studyNoteDisplayHtml(v) {
  return `
    ${v.note ? `<div class="verse-note">${escapeHtml(v.note)}</div>` : ""}
    <div class="note-actions">
      <button type="button" class="link-btn note-toggle-btn">${v.note ? "Edit note" : "Add note"}</button>
      <button type="button" class="link-btn verse-remove-btn">Remove</button>
    </div>
    <div class="error-msg verse-error"></div>
  `;
}

function wireStudyNoteArea(area, topic, verseId) {
  area.querySelector(".note-toggle-btn").addEventListener("click", () => {
    openStudyNoteEditor(area, topic, verseId);
  });
  area.querySelector(".verse-remove-btn").addEventListener("click", (e) => {
    removeStudyVerse(area.closest(".verse-block"), topic, verseId, e.currentTarget);
  });
}

async function removeStudyVerse(block, topic, verseId, btn) {
  const errBox = block.querySelector(".verse-error");
  const verse = topic.verses.find(v => v.verse_id === verseId);
  errBox.textContent = "";
  btn.disabled = true;
  try {
    await api(`/topics/${topic.id}/verses/${verseId}`, "DELETE");
  } catch (err) {
    errBox.textContent = err.message;
    btn.disabled = false;
    return;
  }
  forgetVerseLocally(topic, verse);
  renderStudyRemovedStrip(block, topic, verse);
}

function forgetVerseLocally(topic, verse) {
  topic.verses = topic.verses.filter(v => v.verse_id !== verse.verse_id);
  if (verse.note) topic.note_count -= 1;
  patchCuratedStatus(verse.verse_id, null, "");
}

function renderStudyRemovedStrip(block, topic, verse) {
  block.innerHTML = `
    <div class="removed-strip" role="status">
      <span>Removed ${escapeHtml(verse.reference)}.</span>
      <button type="button" class="link-btn undo-remove-btn">Undo</button>
      <span class="error-msg undo-error"></span>
    </div>
  `;
  const undoBtn = block.querySelector(".undo-remove-btn");
  undoBtn.focus();
  undoBtn.addEventListener("click", () => undoStudyRemove(block, topic, verse, undoBtn));
}

async function undoStudyRemove(block, topic, verse, btn) {
  const errBox = block.querySelector(".undo-error");
  errBox.textContent = "";
  btn.disabled = true;
  try {
    await api(`/topics/${topic.id}/verses`, "POST", {
      verse_id: verse.verse_id,
      status: "approved",
      source: verse.source,
      note: verse.note,
    });
  } catch (err) {
    errBox.textContent = err.message;
    btn.disabled = false;
    return;
  }
  restoreVerseLocally(topic, verse);
  block.innerHTML = studyVerseInnerHtml(verse);
  wireStudyNoteArea(block.querySelector(".note-area"), topic, verse.verse_id);
  block.querySelector(".verse-remove-btn").focus();
}

function restoreVerseLocally(topic, verse) {
  const at = topic.verses.findIndex(v => v.verse_id > verse.verse_id);
  topic.verses.splice(at === -1 ? topic.verses.length : at, 0, verse);
  if (verse.note) topic.note_count += 1;
  patchCuratedStatus(verse.verse_id, "approved", verse.note);
}

function patchCuratedStatus(verseId, status, note) {
  if (!curateState) return;
  const r = curateState.results.find(x => x.verse_id === verseId);
  if (!r) return;
  r.status_in_topic = status;
  r.note = note;
}

function openStudyNoteEditor(area, topic, verseId) {
  const verse = topic.verses.find(v => v.verse_id === verseId);
  area.innerHTML = noteRowHtml(verseId, verse.note);

  const row = area.querySelector(".note-row");
  const cancelBtn = el(`<button type="button" class="link-btn note-cancel-btn">Cancel</button>`);
  row.appendChild(cancelBtn);

  const exitToView = () => {
    area.innerHTML = studyNoteDisplayHtml(verse);
    wireStudyNoteArea(area, topic, verseId);
  };

  // A plain click on Cancel blurs the note input first (default browser
  // behavior for a focus change), which would fire the input's save-on-blur
  // handler before this button's own click handler runs — silently saving
  // instead of discarding. Preventing the default on mousedown stops the
  // focus shift (and so the blur) without affecting the click that follows.
  cancelBtn.addEventListener("mousedown", (e) => e.preventDefault());
  cancelBtn.addEventListener("click", exitToView);
  area.addEventListener("keydown", function onKey(e) {
    if (e.key === "Escape") {
      area.removeEventListener("keydown", onKey);
      exitToView();
    }
  });

  wireNoteRow(area, topic.id, (newNote) => {
    verse.note = newNote;
    exitToView();
  });
}

const MODE_LABELS = {
  prefix: "Word forms",
  exact: "Exact",
  phrase: "Phrase",
};

function renderCurateTab(content, topic) {
  if (!curateState || curateState.topicId !== topic.id) {
    curateState = { topicId: topic.id, mode: "prefix", results: [], total: 0, query: "" };
  }
  const state = curateState;

  content.innerHTML = `
    <div class="search-bar">
      <input type="text" id="search-q" placeholder="Search scripture text…" value="${escapeHtml(state.query)}">
      <select id="search-mode">
        ${Object.entries(MODE_LABELS).map(([v, label]) =>
          `<option value="${v}" ${v === state.mode ? "selected" : ""}>${label}</option>`
        ).join("")}
      </select>
      <button id="search-btn" class="primary">Search</button>
    </div>
    <div class="error-msg" id="search-error"></div>
    <div class="match-count" id="match-count"></div>
    <ul id="results"></ul>
  `;

  const qInput = document.getElementById("search-q");
  const modeSelect = document.getElementById("search-mode");
  const runSearch = () => doSearch(content, topic.id, qInput.value.trim(), modeSelect.value);

  document.getElementById("search-btn").addEventListener("click", runSearch);
  qInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") runSearch();
  });

  if (state.results.length > 0 || state.query) {
    renderResults(content, topic.id);
  }
}

async function doSearch(content, topicId, query, mode) {
  const errBox = document.getElementById("search-error");
  errBox.textContent = "";
  if (!query) return;
  curateState.mode = mode;
  curateState.query = query;
  try {
    const data = await api(`/search?q=${encodeURIComponent(query)}&mode=${encodeURIComponent(mode)}&topic_id=${topicId}`);
    curateState.results = data.results;
    curateState.total = data.total;
    renderResults(content, topicId);
  } catch (err) {
    curateState.results = [];
    curateState.total = 0;
    document.getElementById("match-count").textContent = "";
    document.getElementById("results").innerHTML = "";
    errBox.textContent = err.message;
  }
}

function renderResults(content, topicId) {
  const state = curateState;
  document.getElementById("match-count").textContent =
    state.total > 0
      ? `${state.total} match${state.total === 1 ? "" : "es"}${state.total > state.results.length ? ` (showing ${state.results.length})` : ""}`
      : (state.query ? "No matches." : "");

  const resultsEl = document.getElementById("results");
  resultsEl.innerHTML = state.results.map(renderResultRow).join("");

  resultsEl.querySelectorAll("[data-action]").forEach(node => {
    const verseId = Number(node.dataset.verseId);
    const action = node.dataset.action;
    if (action === "approve" || action === "reject") {
      node.addEventListener("click", () => setVerseStatus(topicId, verseId, action === "approve" ? "approved" : "rejected"));
    } else if (action === "undo") {
      node.addEventListener("click", () => undoVerse(topicId, verseId));
    }
  });

  resultsEl.querySelectorAll(".note-row-wrap").forEach(root => {
    const verseId = Number(root.querySelector(".note-input").dataset.verseId);
    wireNoteRow(root, topicId, (newNote) => {
      const r = findResult(verseId);
      if (r) r.note = newNote;
    });
  });
}

function renderResultRow(r) {
  let statusHtml;
  if (r.status_in_topic === "approved") {
    statusHtml = `
      <span class="badge badge-approved">Approved</span>
      <button class="link-btn" data-action="undo" data-verse-id="${r.verse_id}">Undo</button>
      ${noteRowHtml(r.verse_id, r.note)}
    `;
  } else if (r.status_in_topic === "rejected") {
    statusHtml = `
      <span class="badge badge-rejected">Rejected</span>
      <button class="link-btn" data-action="undo" data-verse-id="${r.verse_id}">Undo</button>
    `;
  } else {
    statusHtml = `
      <button class="btn-approve" data-action="approve" data-verse-id="${r.verse_id}">Approve</button>
      <button class="btn-reject" data-action="reject" data-verse-id="${r.verse_id}">Reject</button>
    `;
  }
  return `
    <li class="result">
      <div class="result-ref">${escapeHtml(r.reference)}</div>
      <div class="result-text">${r.highlighted}</div>
      <div class="result-actions">${statusHtml}</div>
    </li>
  `;
}

function findResult(verseId) {
  return curateState.results.find(r => r.verse_id === verseId);
}

async function setVerseStatus(topicId, verseId, status) {
  const updated = await api(`/topics/${topicId}/verses`, "POST", {
    verse_id: verseId,
    status,
    source: curateState.mode,
  });
  const r = findResult(verseId);
  r.status_in_topic = updated.status;
  r.note = updated.note;
  renderResults(document.getElementById("tab-content"), topicId);
}

async function undoVerse(topicId, verseId) {
  await api(`/topics/${topicId}/verses/${verseId}`, "DELETE");
  const r = findResult(verseId);
  r.status_in_topic = null;
  r.note = "";
  renderResults(document.getElementById("tab-content"), topicId);
}

async function saveNote(topicId, verseId, note) {
  return api(`/topics/${topicId}/verses/${verseId}`, "PATCH", { note });
}

// ---------------------------------------------------------------------------
// Shared, editable note row — used by the Curate tab's result list and the
// Study tab's per-verse editor. `root` is the wrapper containing exactly one
// row; wireNoteRow reads the verse id off the row's own input rather than
// requiring the caller to track it separately.
// ---------------------------------------------------------------------------

function noteRowHtml(verseId, note) {
  return `
    <div class="note-row-wrap">
      <div class="note-row">
        <input type="text" class="note-input" data-verse-id="${verseId}" placeholder="Add a note…" value="${escapeHtml(note || "")}">
        <button type="button" class="note-fill-btn" data-verse-id="${verseId}" title="Fill with AI">&#10022;</button>
        <button type="button" class="note-save-btn primary" data-verse-id="${verseId}">Save note</button>
      </div>
      <div class="error-msg note-fill-error"></div>
    </div>
  `;
}

function flashSaved(btn) {
  const original = btn.textContent;
  btn.textContent = "Saved";
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = original;
    btn.disabled = false;
  }, 1500);
}

function wireNoteRow(root, topicId, onSaved) {
  const input = root.querySelector(".note-input");
  const verseId = Number(input.dataset.verseId);
  const fillBtn = root.querySelector(".note-fill-btn");
  const saveBtn = root.querySelector(".note-save-btn");
  const errBox = root.querySelector(".note-fill-error");

  const doSave = async () => {
    errBox.textContent = "";
    try {
      const updated = await saveNote(topicId, verseId, input.value);
      flashSaved(saveBtn);
      if (onSaved) onSaved(updated.note);
    } catch (err) {
      errBox.textContent = err.message;
    }
  };

  input.addEventListener("change", doSave);
  saveBtn.addEventListener("click", doSave);

  fillBtn.addEventListener("click", async () => {
    errBox.textContent = "";
    const originalLabel = fillBtn.textContent;
    fillBtn.disabled = true;
    fillBtn.textContent = "…";
    try {
      const result = await api(`/ai/topics/${topicId}/verses/${verseId}/note/fill`, "POST", { prompt: input.value.trim() });
      input.value = result.note;
    } catch (err) {
      errBox.textContent = err.message;
    } finally {
      fillBtn.disabled = false;
      fillBtn.textContent = originalLabel;
    }
  });
}
</script>
