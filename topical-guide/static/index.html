<!DOCTYPE html>
<html lang="en">

.header-actions { display: flex; align-items: baseline; gap: 0.8rem; }

.ref-link {

.chapter-panel {

.cv:hover { background: #1c2c4e; }

.cv-current .cv-num { color: #4a90d9; }
.cv-curated { border-left: 3px solid #2a9e5a; padding-left: 0.5rem; }

}
.cv-selected:hover { background: #26397a; }

.chapter-panel-actionbar {

.chapter-panel-selection-info { color: #ccc; font-size: 0.88rem; margin-bottom: 0.6rem; }
.chapter-panel-actionbar-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }

body.panel-open { padding-right: calc(min(440px, 100vw) + 2rem); }
@media (max-width: 900px) {
  body.panel-open { padding-right: 2rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = "/api";

async function api(path, method, body) {
  const opts = { method: method || "GET", headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  if (res.status === 204) return null;
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) {
    const message = (data && data.detail) ? data.detail : ("Request failed (" + res.status + ")");
    const err = new Error(message);
    err.status = res.status;
    throw err;
  }
  return data;
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function el(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html.trim();
  return tpl.content.firstElementChild;
}

// ---------------------------------------------------------------------------
// Routing
// ---------------------------------------------------------------------------

function currentRoute() {
  const hash = location.hash || "#/";
  const m = hash.match(/^#\/topic\/(\d+)$/);
  if (m) return { view: "topic", id: Number(m[1]) };
  return { view: "home" };
}

async function render() {
  const app = document.getElementById("app");
  const route = currentRoute();
  try {
    if (route.view === "topic") {
      await renderTopicPage(app, route.id);
    } else {
      await renderHome(app);
    }
  } catch (err) {
    app.innerHTML = `<p class="error-msg">Failed to load: ${escapeHtml(err.message)}</p>`;
  }
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

// Escape closes the delete modal if one is open, otherwise cancels topic
// edit mode if that's active. One listener, added once; editModeActive and
// cancelEditFn are updated by whichever render function is currently live.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (document.querySelector(".modal-backdrop")) {
    closeDeleteModal();
    return;
  }
  if (chapterPanel && panelSelection) {
    panelSelection = null;
    renderPanelActionBar();
    return;
  }
  if (chapterPanel) {
    closeChapterPanel();
    return;
  }
  if (editModeActive && cancelEditFn) {
    cancelEditFn();
  }
});

// ---------------------------------------------------------------------------
// Home view
// ---------------------------------------------------------------------------

async function renderHome(app) {
  const topics = await api("/topics");
  app.innerHTML = `
    <h1>Topical Guide</h1>
    <p class="subtitle">A personal, curated guide to the scriptures — search, approve, and study by topic.</p>
    <div class="card">
      <div class="ai-fill">
        <input type="text" id="fill-topic-prompt" placeholder="Describe the topic… e.g. verses about praying when you don't feel like it">
        <button type="button" id="fill-topic-btn">&#10022; Fill with AI</button>
      </div>
      <div class="error-msg" id="fill-topic-error"></div>
      <div class="ai-note" id="fill-topic-reason"></div>
      <div class="ai-warn" id="fill-topic-duplicate"></div>
      <form class="inline-form" id="new-topic-form">
        <input type="text" id="new-topic-name" placeholder="New topic name (e.g. Prayer)" required>
        <textarea id="new-topic-desc" rows="3" maxlength="400" placeholder="Description (optional)"></textarea>
        <div>
          <button type="submit" class="primary">Add Topic</button>
        </div>
        <div class="error-msg" id="new-topic-error"></div>
      </form>
    </div>
    <ul class="topic-list" id="topic-list"></ul>
  `;

  const list = document.getElementById("topic-list");
  if (topics.length === 0) {
    list.innerHTML = `<li class="empty-state">No topics yet — add one above to get started.</li>`;
  } else {
    list.innerHTML = topics.map(t => `
      <li>
        <a class="topic-link card" href="#/topic/${t.id}">
          <div class="topic-name">${escapeHtml(t.name)}</div>
          ${t.description ? `<div class="topic-desc">${escapeHtml(t.description)}</div>` : ""}
          <div class="count-badge">${t.approved_count} approved verse${t.approved_count === 1 ? "" : "s"}</div>
        </a>
      </li>
    `).join("");
  }

  document.getElementById("new-topic-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("new-topic-name").value.trim();
    const description = document.getElementById("new-topic-desc").value.trim();
    const errBox = document.getElementById("new-topic-error");
    errBox.textContent = "";
    if (!name) return;
    try {
      const topic = await api("/topics", "POST", { name, description });
      location.hash = `#/topic/${topic.id}`;
    } catch (err) {
      errBox.textContent = err.message;
    }
  });

  document.getElementById("fill-topic-btn").addEventListener("click", async () => {
    const btn = document.getElementById("fill-topic-btn");
    const promptInput = document.getElementById("fill-topic-prompt");
    const errBox = document.getElementById("fill-topic-error");
    const reasonBox = document.getElementById("fill-topic-reason");
    const dupBox = document.getElementById("fill-topic-duplicate");
    errBox.textContent = "";
    reasonBox.textContent = "";
    dupBox.textContent = "";
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Filling…";
    try {
      const result = await api("/ai/topics/fill", "POST", { prompt: promptInput.value.trim() });
      document.getElementById("new-topic-name").value = result.name;
      document.getElementById("new-topic-desc").value = result.description;
      reasonBox.textContent = result.reason;
      if (result.duplicate_of) {
        dupBox.textContent = `Looks like your existing "${result.duplicate_of}". Add it anyway, or cancel.`;
      }
    } catch (err) {
      errBox.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });
}

// ---------------------------------------------------------------------------
// Topic page
// ---------------------------------------------------------------------------

let curateState = null; // { topicId, mode, results, total, query }
let editModeActive = false;
let cancelEditFn = null;
let chapterPanel = null;      // the DOM element, or null when closed
let chapterPanelToken = 0;    // guards against out-of-order fetches
let panelSelection = null;    // { anchor, start, end } (verse ids) or null
let panelChapterData = null;  // last /api/chapter response shown in the panel

// The topic object from whichever renderTopicPage fetch is currently live,
// and which of its tabs is showing. Both tabs re-fetch topic fresh on every
// switch, so there is always exactly one "current" topic — the panel and
// Curate-originated actions (which don't otherwise hold a topic reference)
// read these instead of needing one threaded in.
let activeTopic = null;
let activeTopicTab = "study";

async function renderTopicPage(app, topicId, activeTab) {
  activeTab = activeTab || "study";
  activeTopicTab = activeTab;
  const topic = await api(`/topics/${topicId}`);
  activeTopic = topic;

  app.innerHTML = `
    <a class="back-link" href="#/">&larr; All topics</a>
    <div id="topic-header"></div>
    <div class="tabs">
      <button class="tab-btn" data-tab="study">Study</button>
      <button class="tab-btn" data-tab="curate">Curate</button>
    </div>
    <div id="tab-content"></div>
  `;

  renderTopicHeaderView(topic);

  const tabButtons = app.querySelectorAll(".tab-btn");
  tabButtons.forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === activeTab);
    btn.addEventListener("click", () => {
      renderTopicPage(app, topicId, btn.dataset.tab);
    });
  });

  const content = document.getElementById("tab-content");
  if (activeTab === "study") {
    renderStudyTab(content, topic);
  } else {
    renderCurateTab(content, topic);
  }
}

// ---------------------------------------------------------------------------
// Topic header — view / edit mode. Rendering into #topic-header only (never
// #tab-content) is what lets Edit/Cancel leave an in-progress Curate search
// untouched.
// ---------------------------------------------------------------------------

function renderTopicHeaderView(topic) {
  editModeActive = false;
  cancelEditFn = null;
  const header = document.getElementById("topic-header");
  header.innerHTML = `
    <div class="header-actions">
      <h1>${escapeHtml(topic.name)}</h1>
      <button class="link-btn" id="edit-topic-btn">Edit</button>
    </div>
    ${topic.description ? `<p class="desc-edit">${escapeHtml(topic.description)}</p>` : ""}
  `;
  document.getElementById("edit-topic-btn").addEventListener("click", () => {
    renderTopicHeaderEdit(topic);
  });
}

function renderTopicHeaderEdit(topic) {
  editModeActive = true;
  cancelEditFn = () => renderTopicHeaderView(topic);
  const header = document.getElementById("topic-header");
  header.innerHTML = `
    <div class="edit-form">
      <input type="text" id="edit-topic-name" value="${escapeHtml(topic.name)}" required>
      <textarea id="edit-topic-desc" rows="3" maxlength="400">${escapeHtml(topic.description)}</textarea>
      <div class="ai-fill">
        <input type="text" id="polish-prompt" placeholder="Optional: how to change it…">
        <button type="button" id="polish-btn">&#10022; Polish with AI</button>
      </div>
      <div class="ai-note" id="polish-reason"></div>
      <div class="error-msg" id="edit-topic-error"></div>
      <div class="edit-actions">
        <button type="button" class="primary" id="save-topic-btn">Save changes</button>
        <button type="button" id="cancel-topic-btn">Cancel</button>
        <span class="spacer"></span>
        <button type="button" class="btn-danger" id="delete-topic-btn">Delete topic</button>
      </div>
    </div>
  `;

  const nameInput = document.getElementById("edit-topic-name");
  const descInput = document.getElementById("edit-topic-desc");
  const errBox = document.getElementById("edit-topic-error");

  document.getElementById("cancel-topic-btn").addEventListener("click", () => cancelEditFn());

  document.getElementById("save-topic-btn").addEventListener("click", async () => {
    errBox.textContent = "";
    const name = nameInput.value.trim();
    if (!name) {
      errBox.textContent = "A topic needs a name.";
      return;
    }
    const description = descInput.value.trim();
    try {
      const updated = await api(`/topics/${topic.id}`, "PATCH", { name, description });
      topic.name = updated.name;
      topic.description = updated.description;
      renderTopicHeaderView(topic);
    } catch (err) {
      errBox.textContent = err.message;
    }
  });

  document.getElementById("polish-btn").addEventListener("click", async () => {
    const btn = document.getElementById("polish-btn");
    const promptInput = document.getElementById("polish-prompt");
    const reasonBox = document.getElementById("polish-reason");
    errBox.textContent = "";
    reasonBox.textContent = "";
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Polishing…";
    try {
      const result = await api(`/ai/topics/${topic.id}/description/polish`, "POST", {
        prompt: promptInput.value.trim(),
      });
      descInput.value = result.description;
      if (result.suggested_name) {
        nameInput.value = result.suggested_name;
      }
      reasonBox.textContent = result.reason;
    } catch (err) {
      errBox.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });

  document.getElementById("delete-topic-btn").addEventListener("click", (e) => {
    openDeleteModal(topic, e.currentTarget);
  });
}

// ---------------------------------------------------------------------------
// Delete modal
// ---------------------------------------------------------------------------

function joinWithAnd(items) {
  if (items.length === 1) return items[0];
  return items.slice(0, -1).join(", ") + " and " + items[items.length - 1];
}

function pluralize(n, word) {
  return `${n} ${word}${n === 1 ? "" : "s"}`;
}

function openDeleteModal(topic, triggerBtn) {
  const counts = [];
  const approvedVerseCount = topic.entries.reduce((sum, e) => sum + e.verse_ids.length, 0);
  if (approvedVerseCount > 0) counts.push(pluralize(approvedVerseCount, "approved verse"));
  if (topic.rejected_count > 0) counts.push(pluralize(topic.rejected_count, "rejection"));
  if (topic.note_count > 0) counts.push(pluralize(topic.note_count, "note"));

  const countsSentence = counts.length === 0
    ? "This topic has no verses yet."
    : `This also deletes ${joinWithAnd(counts)}.`;

  const modal = el(`
    <div class="modal-backdrop">
      <div class="modal" role="dialog" aria-modal="true">
        <h2>Delete "${escapeHtml(topic.name)}"?</h2>
        <p>${countsSentence}</p>
        <p>This cannot be undone from the app. The only way back is git history for guide_export.json.</p>
        <div class="error-msg" id="delete-modal-error"></div>
        <div class="modal-actions">
          <button type="button" id="delete-modal-cancel">Cancel</button>
          <button type="button" class="btn-danger" id="delete-modal-confirm">Delete topic</button>
        </div>
      </div>
    </div>
  `);
  modal._triggerBtn = triggerBtn;
  document.body.appendChild(modal);

  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeDeleteModal();
  });
  document.getElementById("delete-modal-cancel").addEventListener("click", () => closeDeleteModal());
  document.getElementById("delete-modal-confirm").addEventListener("click", async () => {
    const errBox = document.getElementById("delete-modal-error");
    try {
      await api(`/topics/${topic.id}`, "DELETE");
      location.hash = "#/";
    } catch (err) {
      errBox.textContent = err.message;
    }
  });

  document.getElementById("delete-modal-cancel").focus();
}

function closeDeleteModal() {
  const modal = document.querySelector(".modal-backdrop");
  if (!modal) return;
  const triggerBtn = modal._triggerBtn;
  modal.remove();
  if (triggerBtn) triggerBtn.focus();
}

// ---------------------------------------------------------------------------
// Volume summary strip — shared by the Study and Curate tabs. Renders every
// entry it is given, in the given order; it does not know the volume names,
// so there is no hardcoded canon list here.
// ---------------------------------------------------------------------------

function volumeSummaryHtml(counts, activeVolumeId, label) {
  const chips = counts.map(c => {
    const classes = ["volume-chip"];
    if (c.volume_id === activeVolumeId) classes.push("active");
    const chipLabel = `${escapeHtml(c.volume)} ${c.count}`;
    if (c.count === 0) {
      // Zero-count chips are non-interactive: a zero is information, not a
      // destination.
      return `<span class="${classes.join(" ")} zero" data-volume-id="${c.volume_id}">${chipLabel}</span>`;
    }
    return `<button type="button" class="${classes.join(" ")}" data-volume-id="${c.volume_id}">${chipLabel}</button>`;
  }).join("");
  const clearBtn = activeVolumeId != null
    ? `<button type="button" class="link-btn volume-clear-btn">Clear filter</button>`
    : "";
  return `
    <div class="volume-summary">
      <div class="volume-summary-label">${escapeHtml(label)}</div>
      <div class="volume-chips">${chips}${clearBtn}</div>
    </div>
  `;
}

function wireVolumeSummary(root, onSelect) {
  root.querySelectorAll("button.volume-chip").forEach(chip => {
    chip.addEventListener("click", () => onSelect(Number(chip.dataset.volumeId)));
  });
  const clearBtn = root.querySelector(".volume-clear-btn");
  if (clearBtn) clearBtn.addEventListener("click", () => onSelect(null));
}

// ---------------------------------------------------------------------------
// Study tab
// ---------------------------------------------------------------------------

// Session-only, like round 3's undo strip: cleared on every render of the
// Study tab (page load and tab switch both go through renderStudyTab), never
// persisted alongside topic state.
let studyVolumeFilter = null;

function studyVolumeSummaryLabel(topic) {
  const passages = topic.entries.length;
  const verseCount = topic.entries.reduce((sum, e) => sum + e.verse_ids.length, 0);
  return `In this topic — ${pluralize(passages, "passage")} · ${pluralize(verseCount, "verse")}`;
}

function renderStudyVolumeSummary(topic) {
  const root = document.getElementById("study-volume-summary");
  if (!root) return;
  root.innerHTML = volumeSummaryHtml(topic.volume_counts, studyVolumeFilter, studyVolumeSummaryLabel(topic));
  wireVolumeSummary(root, (volumeId) => {
    studyVolumeFilter = volumeId;
    renderStudyVolumeSummary(topic);
    renderStudyVerseList(topic);
  });
}

function renderStudyVerseList(topic) {
  const listEl = document.getElementById("study-verse-list");
  const entries = topic.entries.filter(e => !studyVolumeFilter || e.volume_id === studyVolumeFilter);
  if (entries.length === 0) {
    const filtered = topic.volume_counts.find(c => c.volume_id === studyVolumeFilter);
    listEl.innerHTML = `<p class="empty-state">No ${escapeHtml(filtered ? filtered.volume : "")} verses in this topic.</p>`;
    return;
  }
  listEl.innerHTML = entries.map(e => `
    <div class="entry-block" data-entry-id="${e.entry_id}">${studyEntryInnerHtml(e)}</div>
  `).join("");

  listEl.querySelectorAll(".entry-block").forEach(block => {
    const entryId = Number(block.dataset.entryId);
    wireEntryBlock(block, topic, entryId);
  });
}

function renderStudyTab(content, topic) {
  studyVolumeFilter = null;
  if (topic.entries.length === 0) {
    content.innerHTML = `<p class="empty-state">No approved verses yet. Switch to the Curate tab to search and approve some.</p>`;
    return;
  }
  content.innerHTML = `
    <div id="study-volume-summary"></div>
    <div id="study-verse-list"></div>
  `;
  renderStudyVolumeSummary(topic);
  renderStudyVerseList(topic);
}

function studyEntryInnerHtml(e) {
  const versesHtml = e.verses.length > 1
    ? e.verses.map(v => `<span class="ev"><span class="ev-num">${v.verse}</span>${escapeHtml(v.text)}</span>`).join(" ")
    : escapeHtml(e.verses[0].text);
  return `
    <button type="button" class="verse-ref ref-link" data-verse-id="${e.verse_ids[0]}">${escapeHtml(e.reference)}</button>
    <div class="verse-text">${versesHtml}</div>
    <div class="note-area" data-entry-id="${e.entry_id}">${studyNoteDisplayHtml(e)}</div>
  `;
}

function studyNoteDisplayHtml(e) {
  return `
    ${e.note ? `<div class="verse-note">${escapeHtml(e.note)}</div>` : ""}
    <div class="note-actions">
      <button type="button" class="link-btn note-toggle-btn">${e.note ? "Edit note" : "Add note"}</button>
      <button type="button" class="link-btn verse-remove-btn">Remove</button>
    </div>
    <div class="error-msg verse-error"></div>
  `;
}

function wireStudyNoteArea(area, topic, entryId) {
  area.querySelector(".note-toggle-btn").addEventListener("click", () => {
    openStudyNoteEditor(area, topic, entryId);
  });
  area.querySelector(".verse-remove-btn").addEventListener("click", (e) => {
    removeStudyEntry(area.closest(".entry-block"), topic, entryId, e.currentTarget);
  });
}

// Shared by the render path (renderStudyVerseList) and the undo path
// (undoStudyRemove) — a button wired only in one of them dies after an undo.
function wireEntryBlock(block, topic, entryId) {
  wireStudyNoteArea(block.querySelector(".note-area"), topic, entryId);
  const refBtn = block.querySelector(".ref-link");
  refBtn.addEventListener("click", () => openChapterPanel(Number(refBtn.dataset.verseId), refBtn));
}

async function removeStudyEntry(block, topic, entryId, btn) {
  const errBox = block.querySelector(".verse-error");
  const entry = topic.entries.find(e => e.entry_id === entryId);
  errBox.textContent = "";
  btn.disabled = true;
  try {
    await api(`/topics/${topic.id}/entries/${entryId}`, "DELETE");
  } catch (err) {
    errBox.textContent = err.message;
    btn.disabled = false;
    return;
  }
  forgetEntryLocally(topic, entry);
  renderStudyRemovedStrip(block, topic, entry);
}

function forgetEntryLocally(topic, entry) {
  topic.entries = topic.entries.filter(e => e.entry_id !== entry.entry_id);
  patchCuratedStatusForEntry(entry, null);
  patchStudySummary(topic);
}

// Recomputes volume_counts from topic.entries (the in-memory source of truth
// after a local forget/restore) and replaces only the strip's inner HTML —
// removeStudyEntry never re-renders the verse list, so this must not either,
// or it would destroy other entries' undo strips.
function patchStudySummary(topic) {
  const counts = topic.volume_counts.map(c => ({ ...c, count: 0 }));
  const byId = new Map(counts.map(c => [c.volume_id, c]));
  for (const e of topic.entries) {
    const c = byId.get(e.volume_id);
    if (c) c.count += 1;
  }
  topic.volume_counts = counts;
  renderStudyVolumeSummary(topic);
}

function renderStudyRemovedStrip(block, topic, entry) {
  block.innerHTML = `
    <div class="removed-strip" role="status">
      <span>Removed ${escapeHtml(entry.reference)}.</span>
      <button type="button" class="link-btn undo-remove-btn">Undo</button>
      <span class="error-msg undo-error"></span>
    </div>
  `;
  const undoBtn = block.querySelector(".undo-remove-btn");
  undoBtn.focus();
  undoBtn.addEventListener("click", () => undoStudyRemove(block, topic, entry, undoBtn));
}

async function undoStudyRemove(block, topic, entry, btn) {
  const errBox = block.querySelector(".undo-error");
  errBox.textContent = "";
  btn.disabled = true;
  let restored;
  try {
    restored = await api(`/topics/${topic.id}/entries`, "POST", {
      start_verse_id: entry.verse_ids[0],
      end_verse_id: entry.verse_ids[entry.verse_ids.length - 1],
      status: entry.status,
      source: entry.source,
      note: entry.note,
    });
  } catch (err) {
    errBox.textContent = err.message;
    btn.disabled = false;
    return;
  }
  restoreEntryLocally(topic, restored);
  block.dataset.entryId = restored.entry_id;
  block.innerHTML = studyEntryInnerHtml(restored);
  wireEntryBlock(block, topic, restored.entry_id);
  block.querySelector(".verse-remove-btn").focus();
}

function restoreEntryLocally(topic, entry) {
  const at = topic.entries.findIndex(e => e.verse_ids[0] > entry.verse_ids[0]);
  topic.entries.splice(at === -1 ? topic.entries.length : at, 0, entry);
  patchCuratedStatusForEntry(entry, entry.status);
  patchStudySummary(topic);
}

function patchCuratedStatusForEntry(entry, newStatus) {
  if (!curateState) return;
  for (const vid of entry.verse_ids) {
    const r = curateState.results.find(x => x.verse_id === vid);
    if (!r) continue;
    r.status_in_topic = newStatus;
    r.entry_id = newStatus ? entry.entry_id : null;
    r.entry_reference = newStatus && entry.verse_ids.length > 1 ? entry.reference : null;
    r.note = newStatus ? entry.note : "";
  }
}

function openStudyNoteEditor(area, topic, entryId) {
  const entry = topic.entries.find(e => e.entry_id === entryId);
  area.innerHTML = noteRowHtml(entryId, entry.note);

  const row = area.querySelector(".note-row");
  const cancelBtn = el(`<button type="button" class="link-btn note-cancel-btn">Cancel</button>`);
  row.appendChild(cancelBtn);

  const exitToView = () => {
    area.innerHTML = studyNoteDisplayHtml(entry);
    wireStudyNoteArea(area, topic, entryId);
  };

  // A plain click on Cancel blurs the note input first (default browser
  // behavior for a focus change), which would fire the input's save-on-blur
  // handler before this button's own click handler runs — silently saving
  // instead of discarding. Preventing the default on mousedown stops the
  // focus shift (and so the blur) without affecting the click that follows.
  cancelBtn.addEventListener("mousedown", (e) => e.preventDefault());
  cancelBtn.addEventListener("click", exitToView);
  area.addEventListener("keydown", function onKey(e) {
    if (e.key === "Escape") {
      area.removeEventListener("keydown", onKey);
      exitToView();
    }
  });

  wireNoteRow(area, topic.id, (newNote) => {
    entry.note = newNote;
    exitToView();
  });
}

const MODE_LABELS = {
  prefix: "Word forms",
  exact: "Exact",
  phrase: "Phrase",
};

function renderCurateTab(content, topic) {
  if (!curateState || curateState.topicId !== topic.id) {
    curateState = {
      topicId: topic.id, mode: "prefix", results: [], total: 0, query: "",
      volumeId: null, volumeCounts: [],
    };
  }
  const state = curateState;

  content.innerHTML = `
    <div class="search-bar">
      <input type="text" id="search-q" placeholder="Search scripture text…" value="${escapeHtml(state.query)}">
      <select id="search-mode">
        ${Object.entries(MODE_LABELS).map(([v, label]) =>
          `<option value="${v}" ${v === state.mode ? "selected" : ""}>${label}</option>`
        ).join("")}
      </select>
      <button id="search-btn" class="primary">Search</button>
    </div>
    <div class="error-msg" id="search-error"></div>
    <div class="match-count" id="match-count"></div>
    <div id="volume-summary"></div>
    <ul id="results"></ul>
  `;

  const qInput = document.getElementById("search-q");
  const modeSelect = document.getElementById("search-mode");
  const runSearch = () => doSearch(content, topic.id, qInput.value.trim(), modeSelect.value, null);

  document.getElementById("search-btn").addEventListener("click", runSearch);
  qInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") runSearch();
  });

  if (state.results.length > 0 || state.query) {
    renderResults(content, topic.id);
  }
}

async function doSearch(content, topicId, query, mode, volumeId) {
  const errBox = document.getElementById("search-error");
  errBox.textContent = "";
  if (!query) return;
  curateState.mode = mode;
  curateState.query = query;
  curateState.volumeId = volumeId != null ? volumeId : null;
  try {
    let url = `/search?q=${encodeURIComponent(query)}&mode=${encodeURIComponent(mode)}&topic_id=${topicId}`;
    if (curateState.volumeId != null) url += `&volume_id=${curateState.volumeId}`;
    const data = await api(url);
    curateState.results = data.results;
    curateState.total = data.total;
    curateState.volumeCounts = data.volume_counts;
    renderResults(content, topicId);
  } catch (err) {
    curateState.results = [];
    curateState.total = 0;
    curateState.volumeCounts = [];
    document.getElementById("match-count").textContent = "";
    document.getElementById("volume-summary").innerHTML = "";
    document.getElementById("results").innerHTML = "";
    errBox.textContent = err.message;
  }
}

function curateVolumeSummaryLabel(state) {
  const total = state.volumeCounts.reduce((sum, c) => sum + c.count, 0);
  return `${total} match${total === 1 ? "" : "es"} by volume`;
}

function renderCurateVolumeSummary(content, topicId) {
  const root = document.getElementById("volume-summary");
  if (!root) return;
  const state = curateState;
  if (state.volumeCounts.length === 0) {
    root.innerHTML = "";
    return;
  }
  root.innerHTML = volumeSummaryHtml(state.volumeCounts, state.volumeId, curateVolumeSummaryLabel(state));
  wireVolumeSummary(root, (volumeId) => {
    doSearch(content, topicId, state.query, state.mode, volumeId);
  });
}

function renderResults(content, topicId) {
  const state = curateState;
  document.getElementById("match-count").textContent =
    state.total > 0
      ? `${state.total} match${state.total === 1 ? "" : "es"}${state.total > state.results.length ? ` (showing ${state.results.length})` : ""}`
      : (state.query ? "No matches." : "");

  renderCurateVolumeSummary(content, topicId);

  const resultsEl = document.getElementById("results");
  resultsEl.innerHTML = state.results.map(renderResultRow).join("");

  resultsEl.querySelectorAll("[data-action]").forEach(node => {
    const verseId = Number(node.dataset.verseId);
    const action = node.dataset.action;
    if (action === "approve" || action === "reject") {
      node.addEventListener("click", () => setVerseStatus(topicId, verseId, action === "approve" ? "approved" : "rejected"));
    } else if (action === "undo") {
      node.addEventListener("click", () => undoVerse(topicId, verseId));
    } else if (action === "remove-passage") {
      node.addEventListener("click", () => removeCuratePassage(topicId, Number(node.dataset.entryId)));
    } else if (action === "context") {
      node.addEventListener("click", () => openChapterPanel(verseId, node));
    }
  });

  resultsEl.querySelectorAll(".note-row-wrap").forEach(root => {
    const entryId = Number(root.querySelector(".note-input").dataset.entryId);
    wireNoteRow(root, topicId, (newNote) => {
      const r = curateState.results.find(x => x.entry_id === entryId);
      if (r) r.note = newNote;
    });
  });
}

function renderResultRow(r) {
  let statusHtml;
  if (r.status_in_topic === "approved" && r.entry_reference) {
    statusHtml = `
      <span class="badge badge-approved">In ${escapeHtml(r.entry_reference)}</span>
      <button class="link-btn" data-action="remove-passage" data-verse-id="${r.verse_id}" data-entry-id="${r.entry_id}">Remove passage</button>
    `;
  } else if (r.status_in_topic === "approved") {
    statusHtml = `
      <span class="badge badge-approved">Approved</span>
      <button class="link-btn" data-action="undo" data-verse-id="${r.verse_id}">Undo</button>
      ${noteRowHtml(r.entry_id, r.note)}
    `;
  } else if (r.status_in_topic === "rejected") {
    statusHtml = `
      <span class="badge badge-rejected">Rejected</span>
      <button class="link-btn" data-action="undo" data-verse-id="${r.verse_id}">Undo</button>
    `;
  } else {
    statusHtml = `
      <button class="btn-approve" data-action="approve" data-verse-id="${r.verse_id}">Approve</button>
      <button class="btn-reject" data-action="reject" data-verse-id="${r.verse_id}">Reject</button>
    `;
  }
  return `
    <li class="result">
      <button type="button" class="result-ref ref-link" data-action="context" data-verse-id="${r.verse_id}">${escapeHtml(r.reference)}</button>
      <div class="result-text">${r.highlighted}</div>
      <div class="result-actions">${statusHtml}</div>
    </li>
  `;
}

async function setVerseStatus(topicId, verseId, status) {
  const entry = await api(`/topics/${topicId}/entries`, "POST", {
    start_verse_id: verseId,
    end_verse_id: verseId,
    status,
    source: curateState.mode,
  });
  applyEntryChange(entry, []);
}

async function undoVerse(topicId, verseId) {
  const r = curateState.results.find(x => x.verse_id === verseId);
  await api(`/topics/${topicId}/entries/${r.entry_id}`, "DELETE");
  applyEntryChange(null, [r.entry_id]);
}

async function removeCuratePassage(topicId, entryId) {
  await api(`/topics/${topicId}/entries/${entryId}`, "DELETE");
  applyEntryChange(null, [entryId]);
}

async function saveNote(topicId, entryId, note) {
  return api(`/topics/${topicId}/entries/${entryId}`, "PATCH", { note });
}

// ---------------------------------------------------------------------------
// Shared, editable note row — used by the Curate tab's result list and the
// Study tab's per-verse editor. `root` is the wrapper containing exactly one
// row; wireNoteRow reads the verse id off the row's own input rather than
// requiring the caller to track it separately.
// ---------------------------------------------------------------------------

function noteRowHtml(entryId, note) {
  return `
    <div class="note-row-wrap">
      <div class="note-row">
        <input type="text" class="note-input" data-entry-id="${entryId}" placeholder="Add a note…" value="${escapeHtml(note || "")}">
        <button type="button" class="note-fill-btn" data-entry-id="${entryId}" title="Fill with AI">&#10022;</button>
        <button type="button" class="note-save-btn primary" data-entry-id="${entryId}">Save note</button>
      </div>
      <div class="error-msg note-fill-error"></div>
    </div>
  `;
}

function flashSaved(btn) {
  const original = btn.textContent;
  btn.textContent = "Saved";
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = original;
    btn.disabled = false;
  }, 1500);
}

function wireNoteRow(root, topicId, onSaved) {
  const input = root.querySelector(".note-input");
  const entryId = Number(input.dataset.entryId);
  const fillBtn = root.querySelector(".note-fill-btn");
  const saveBtn = root.querySelector(".note-save-btn");
  const errBox = root.querySelector(".note-fill-error");

  const doSave = async () => {
    errBox.textContent = "";
    try {
      const updated = await saveNote(topicId, entryId, input.value);
      flashSaved(saveBtn);
      if (onSaved) onSaved(updated.note);
    } catch (err) {
      errBox.textContent = err.message;
    }
  };

  input.addEventListener("change", doSave);
  saveBtn.addEventListener("click", doSave);

  fillBtn.addEventListener("click", async () => {
    errBox.textContent = "";
    const originalLabel = fillBtn.textContent;
    fillBtn.disabled = true;
    fillBtn.textContent = "…";
    try {
      const result = await api(`/ai/topics/${topicId}/entries/${entryId}/note/fill`, "POST", { prompt: input.value.trim() });
      input.value = result.note;
    } catch (err) {
      errBox.textContent = err.message;
    } finally {
      fillBtn.disabled = false;
      fillBtn.textContent = originalLabel;
    }
  });
}

// ---------------------------------------------------------------------------
// Chapter context panel — mounted on document.body (not #app), since both
// tabs re-render #tab-content freely and would destroy it. Round 6 turns it
// from read-only context into the selector: click a verse to anchor,
// shift-click another to set the far end, then Add/Merge/Remove the range
// via the action bar. The actual POST/DELETE always uses the raw selection —
// the server's own absorption logic decides the final range; anything
// computed here from panelChapterData is purely a label preview.
// ---------------------------------------------------------------------------

function chapterPanelShellHtml() {
  return `
    <div class="chapter-panel" role="complementary" aria-label="Chapter context">
      <div class="chapter-panel-head">
        <div class="chapter-panel-title">Loading…</div>
        <button type="button" class="chapter-panel-close" aria-label="Close">&#10005;</button>
      </div>
      <div class="chapter-panel-body">Loading…</div>
      <div class="chapter-panel-actionbar"></div>
    </div>
  `;
}

async function openChapterPanel(verseId, triggerBtn) {
  if (!chapterPanel) {
    chapterPanel = el(chapterPanelShellHtml());
    document.body.appendChild(chapterPanel);
    document.body.classList.add("panel-open");
    chapterPanel.querySelector(".chapter-panel-close").addEventListener("click", closeChapterPanel);
  } else {
    chapterPanel.querySelector(".chapter-panel-title").textContent = "Loading…";
    chapterPanel.querySelector(".chapter-panel-body").textContent = "Loading…";
    chapterPanel.querySelector(".chapter-panel-actionbar").innerHTML = "";
    const existingExt = chapterPanel.querySelector(".chapter-panel-ext");
    if (existingExt) existingExt.remove();
  }
  chapterPanel._triggerBtn = triggerBtn;
  panelSelection = null;
  panelChapterData = null;

  const token = ++chapterPanelToken;
  let data;
  try {
    const topicQuery = activeTopic ? `&topic_id=${activeTopic.id}` : "";
    data = await api(`/chapter?verse_id=${verseId}${topicQuery}`);
  } catch (err) {
    if (token !== chapterPanelToken) return;
    chapterPanel.querySelector(".chapter-panel-title").textContent = "Error";
    chapterPanel.querySelector(".chapter-panel-body").innerHTML =
      `<p class="error-msg">${escapeHtml(err.message)}</p>`;
    chapterPanel.querySelector(".chapter-panel-close").focus();
    return;
  }
  if (token !== chapterPanelToken) return;

  const head = chapterPanel.querySelector(".chapter-panel-head");
  head.querySelector(".chapter-panel-title").textContent = data.reference;
  const extLink = el(`<a class="chapter-panel-ext" href="${escapeHtml(data.external_url)}" target="_blank" rel="noopener noreferrer">churchofjesuschrist.org &#8599;</a>`);
  head.insertBefore(extLink, head.querySelector(".chapter-panel-close"));

  panelChapterData = data;
  chapterPanel.querySelector(".chapter-panel-body").innerHTML = data.verses.map(v => `
    <button type="button" class="cv${v.verse === data.verse ? " cv-current" : ""}" data-verse-id="${v.verse_id}"><span class="cv-num">${v.verse}</span><span class="cv-text">${escapeHtml(v.text)}</span></button>
  `).join("");
  wireChapterPanelVerseButtons();
  renderPanelCuratedTint();
  renderPanelActionBar();

  const current = chapterPanel.querySelector(".cv-current");
  if (current) current.scrollIntoView({ block: "center" });

  chapterPanel.querySelector(".chapter-panel-close").focus();
}

function closeChapterPanel() {
  if (!chapterPanel) return;
  const triggerBtn = chapterPanel._triggerBtn;
  chapterPanel.remove();
  chapterPanel = null;
  chapterPanelToken++; // stale any in-flight fetch so it can't touch a null panel
  panelSelection = null;
  panelChapterData = null;
  document.body.classList.remove("panel-open");
  if (triggerBtn && triggerBtn.isConnected) triggerBtn.focus();
}

function wireChapterPanelVerseButtons() {
  chapterPanel.querySelectorAll(".cv").forEach(btn => {
    const verseId = Number(btn.dataset.verseId);
    btn.addEventListener("click", (e) => {
      if (e.shiftKey && panelSelection) {
        panelSelection = {
          anchor: panelSelection.anchor,
          start: Math.min(panelSelection.anchor, verseId),
          end: Math.max(panelSelection.anchor, verseId),
        };
      } else if (
        panelSelection && panelSelection.start === panelSelection.end &&
        panelSelection.start === verseId
      ) {
        panelSelection = null; // clicking the currently-selected single verse clears it
      } else {
        panelSelection = { anchor: verseId, start: verseId, end: verseId };
      }
      renderPanelSelectionTint();
      renderPanelActionBar();
    });
  });
}

function renderPanelCuratedTint() {
  if (!chapterPanel || !panelChapterData) return;
  chapterPanel.querySelectorAll(".cv").forEach(btn => {
    const vid = Number(btn.dataset.verseId);
    const v = panelChapterData.verses.find(x => x.verse_id === vid);
    btn.classList.toggle("cv-curated", !!(v && v.entry_id != null));
  });
}

function renderPanelSelectionTint() {
  if (!chapterPanel) return;
  chapterPanel.querySelectorAll(".cv").forEach(btn => {
    const vid = Number(btn.dataset.verseId);
    const selected = !!panelSelection && vid >= panelSelection.start && vid <= panelSelection.end;
    btn.classList.toggle("cv-selected", selected);
  });
}

function passageReferenceFor(startNum, endNum) {
  const base = `${panelChapterData.book} ${panelChapterData.chapter}:${startNum}`;
  return startNum === endNum ? base : `${base}–${endNum}`;
}

function renderPanelActionBar() {
  if (!chapterPanel || !panelChapterData) return;
  const bar = chapterPanel.querySelector(".chapter-panel-actionbar");
  if (!panelSelection) {
    bar.innerHTML = `<div class="chapter-panel-hint">Click a verse, shift-click another to select a range.</div>`;
    return;
  }

  const selectedVerses = panelChapterData.verses.filter(
    v => v.verse_id >= panelSelection.start && v.verse_id <= panelSelection.end
  );
  const label = `${passageReferenceFor(selectedVerses[0].verse, selectedVerses[selectedVerses.length - 1].verse)} · ${pluralize(selectedVerses.length, "verse")}`;

  const overlappingEntryIds = [...new Set(selectedVerses.map(v => v.entry_id).filter(id => id != null))];

  let actionHtml;
  let noteHtml = "";
  if (overlappingEntryIds.length === 0) {
    actionHtml = `<button type="button" class="primary" id="panel-action-btn">Add to ${escapeHtml(activeTopic.name)}</button>`;
  } else if (overlappingEntryIds.length === 1 && (() => {
    const entryVerses = panelChapterData.verses.filter(v => v.entry_id === overlappingEntryIds[0]);
    const entryMin = Math.min(...entryVerses.map(v => v.verse_id));
    const entryMax = Math.max(...entryVerses.map(v => v.verse_id));
    return entryMin === panelSelection.start && entryMax === panelSelection.end;
  })()) {
    const entryId = overlappingEntryIds[0];
    const entry = activeTopic.entries.find(e => e.entry_id === entryId);
    actionHtml = `<button type="button" class="btn-danger" id="panel-action-btn" data-mode="remove" data-entry-id="${entryId}">Remove from ${escapeHtml(activeTopic.name)}</button>`;
    if (entry && entry.note) {
      noteHtml = `<div class="verse-note">${escapeHtml(entry.note)}</div>`;
    }
  } else {
    let unionStart = panelSelection.start, unionEnd = panelSelection.end;
    for (const entryId of overlappingEntryIds) {
      for (const v of panelChapterData.verses) {
        if (v.entry_id !== entryId) continue;
        if (v.verse_id < unionStart) unionStart = v.verse_id;
        if (v.verse_id > unionEnd) unionEnd = v.verse_id;
      }
    }
    const unionVerses = panelChapterData.verses.filter(v => v.verse_id >= unionStart && v.verse_id <= unionEnd);
    const mergedRef = passageReferenceFor(unionVerses[0].verse, unionVerses[unionVerses.length - 1].verse);
    actionHtml = `<button type="button" class="primary" id="panel-action-btn" data-mode="merge">Merge into ${escapeHtml(mergedRef)}</button>`;
  }

  bar.innerHTML = `
    <div class="chapter-panel-selection-info">${escapeHtml(label)}</div>
    <div class="chapter-panel-actionbar-row">
      ${actionHtml}
      <button type="button" class="link-btn" id="panel-clear-btn">Clear</button>
    </div>
    <div class="error-msg" id="panel-action-error"></div>
    ${noteHtml}
  `;

  bar.querySelector("#panel-action-btn").addEventListener("click", handlePanelAction);
  bar.querySelector("#panel-clear-btn").addEventListener("click", () => {
    panelSelection = null;
    renderPanelSelectionTint();
    renderPanelActionBar();
  });
}

async function handlePanelAction() {
  const bar = chapterPanel.querySelector(".chapter-panel-actionbar");
  const btn = bar.querySelector("#panel-action-btn");
  const errBox = bar.querySelector("#panel-action-error");
  errBox.textContent = "";
  btn.disabled = true;
  try {
    if (btn.dataset.mode === "remove") {
      const entryId = Number(btn.dataset.entryId);
      await api(`/topics/${activeTopic.id}/entries/${entryId}`, "DELETE");
      applyEntryChange(null, [entryId]);
    } else {
      const removedEntryIds = [...new Set(
        panelChapterData.verses
          .filter(v => v.verse_id >= panelSelection.start && v.verse_id <= panelSelection.end)
          .map(v => v.entry_id)
          .filter(id => id != null)
      )];
      const entry = await api(`/topics/${activeTopic.id}/entries`, "POST", {
        start_verse_id: panelSelection.start,
        end_verse_id: panelSelection.end,
        status: "approved",
        source: "manual",
      });
      applyEntryChange(entry, removedEntryIds);
    }
  } catch (err) {
    errBox.textContent = err.message;
    btn.disabled = false;
  }
}

// Backs the panel's Add/Merge/Remove *and* Curate's approve/reject/undo/
// remove-passage — the one code path that mutates local state after any
// curation change reaches topic.entries (Study), curateState.results
// (Curate), and the open panel's own tint, wherever each of those happens to
// currently exist. `entry` is null for a pure removal.
function applyEntryChange(entry, removedEntryIds) {
  if (activeTopic) {
    activeTopic.entries = activeTopic.entries.filter(e => !removedEntryIds.includes(e.entry_id));
    if (entry) {
      const at = activeTopic.entries.findIndex(e => e.verse_ids[0] > entry.verse_ids[0]);
      activeTopic.entries.splice(at === -1 ? activeTopic.entries.length : at, 0, entry);
    }
    patchStudySummary(activeTopic);
    if (activeTopicTab === "study" && document.getElementById("study-verse-list")) {
      renderStudyVerseList(activeTopic);
    }
  }

  if (curateState && activeTopic && curateState.topicId === activeTopic.id) {
    for (const r of curateState.results) {
      if (entry && entry.verse_ids.includes(r.verse_id)) {
        r.status_in_topic = entry.status;
        r.entry_id = entry.entry_id;
        r.entry_reference = entry.verse_ids.length > 1 ? entry.reference : null;
        r.note = entry.note;
      } else if (removedEntryIds.includes(r.entry_id)) {
        r.status_in_topic = null;
        r.entry_id = null;
        r.entry_reference = null;
        r.note = "";
      }
    }
    if (document.getElementById("results")) {
      renderResults(document.getElementById("tab-content"), curateState.topicId);
    }
  }

  if (panelChapterData) {
    panelChapterData.verses.forEach(v => {
      if (removedEntryIds.includes(v.entry_id)) v.entry_id = null;
      if (entry && entry.verse_ids.includes(v.verse_id)) v.entry_id = entry.entry_id;
    });
    if (chapterPanel) renderPanelCuratedTint();
  }

  panelSelection = null;
  if (chapterPanel) {
    renderPanelSelectionTint();
    renderPanelActionBar();
  }
}
</script>
</body>
</html>
